<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ESCARLÚ - Iniciar Sesión</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet"/>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        body {
            background-color: #FAF5F6;
            background-image: radial-gradient(circle at 100% 0%, rgba(248, 200, 212, 0.4) 0%, transparent 40%),
                              radial-gradient(circle at 0% 100%, rgba(248, 200, 212, 0.2) 0%, transparent 40%);
        }
        .login-card {
            background: #FFFFFF;
            border: 1px solid rgba(248, 200, 212, 0.6);
            box-shadow: 0 12px 40px rgba(116, 84, 117, 0.08);
            border-radius: 32px;
            position: relative;
        }
        .login-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 32px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(248, 200, 212, 0.8), rgba(197, 155, 39, 0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .accent-line-gold {
            background: linear-gradient(90deg, transparent, #C59B27 50%, transparent);
            height: 1px;
            opacity: 0.6;
        }
        .btn-premium {
            background: linear-gradient(135deg, #2E2A2D 0%, #1A1A1A 100%);
            box-shadow: 0 4px 15px rgba(26, 26, 26, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 26, 26, 0.35);
            background: linear-gradient(135deg, #1A1A1A 0%, #0D0D0D 100%);
        }
        .btn-premium:active {
            transform: translateY(0);
        }
        .input-premium {
            border: 2px solid #F0E3E6 !important;
            transition: all 0.25s ease;
        }
        .input-premium:focus {
            border-color: #F8C8D4 !important;
            box-shadow: 0 0 0 4px rgba(248, 200, 212, 0.25) !important;
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex items-center justify-center p-4 antialiased">

<div class="w-full max-w-[1100px] h-[650px] bg-white rounded-[32px] shadow-2xl flex overflow-hidden border border-[#F8C8D4]/50">
    <!-- Left Panel: Brand & Visuals (Estilo Banner Silueta Escarlú) -->
    <div class="hidden md:flex md:w-1/2 relative bg-[#FCECEE] items-center justify-center p-12 overflow-hidden select-none">
        <!-- Fondo Decorativo Rosas / Siluetas -->
        <div class="absolute inset-0 opacity-15 pointer-events-none">
            <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="90" cy="10" r="40" fill="#F8C8D4" />
                <circle cx="-10" cy="90" r="60" fill="#F8C8D4" />
            </svg>
        </div>
        
        <div class="relative z-10 flex flex-col items-center text-center">
            <!-- Icono Decorativo Silueta Maniquí / Marca -->
            <div class="w-72 h-72 mb-6 flex items-center justify-center relative">
                <!-- SVG Garland/Foliage e Icono Escarlú -->
                <svg viewBox="0 0 200 200" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                    <!-- Silueta Garza / Icono Escarlú estilizado -->
                    <path d="M100 30 C85 60 70 80 70 110 C70 140 100 170 100 170 C100 170 130 140 130 110 C130 80 115 60 100 30 Z" fill="none" stroke="#C59B27" stroke-width="1.5" />
                    <!-- Ala/Detalle garza interior -->
                    <path d="M100 60 C90 85 85 105 85 115 C85 130 100 145 100 145" fill="none" stroke="#C59B27" stroke-width="1" />
                    <circle cx="100" cy="110" r="4" fill="#C59B27"/>
                    <!-- Texto de marca curvo o decoraciones -->
                    <path d="M40 110 Q100 150 160 110" fill="none" stroke="#F8C8D4" stroke-width="2" />
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <img src="logo_nuevo.jpeg" alt="Escarlú Silueta" class="w-32 h-32 rounded-full object-cover border-4 border-[#FAF5F6] shadow-md"/>
                </div>
            </div>
            <h2 class="font-headline-lg text-4xl font-bold text-[#1A1A1A] tracking-wider">ESCARLÚ</h2>
            <div class="w-24 accent-line-gold my-3"></div>
            <p class="text-xs uppercase tracking-[0.2em] text-[#C59B27] font-bold">Esencia & Estilo</p>
            <p class="italic text-[#7A6B24] text-sm mt-3">Gestionamos tu negocio con esencia, estilo y excelencia.</p>
        </div>
        
        <!-- Líneas Doradas abstractas decorativas del fondo -->
        <div class="absolute bottom-0 right-0 w-32 h-32 opacity-30">
            <svg class="w-full h-full" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,100 C30,80 60,80 100,100 M0,90 C30,70 60,70 100,90" fill="none" stroke="#C59B27" stroke-width="1.5"/>
            </svg>
        </div>
    </div>

    <!-- Right Panel: Login Card Form -->
    <div class="w-full md:w-1/2 flex items-center justify-center p-8 bg-[#FAF5F6]">
        <div class="login-card w-full max-w-[440px] p-8">
            <header class="text-center flex flex-col items-center gap-1.5 mb-6">
                <!-- Logo Redondeado con su badge de marca -->
                <div class="w-20 h-20 rounded-2xl overflow-hidden border border-[#F8C8D4] p-1 bg-white mb-2 shadow-sm">
                    <img src="logo_nuevo.jpeg" alt="Escarlú Logo" class="object-cover w-full h-full rounded-xl"/>
                </div>
                <h1 class="text-3xl font-extrabold text-[#1A1A1A] tracking-tight">ESCARLÚ</h1>
                <div class="w-20 accent-line-gold my-1.5"></div>
                <p class="text-xs uppercase tracking-[0.15em] text-[#C59B27] font-bold">Esencia & Estilo</p>
                <p class="text-xs text-on-surface-variant italic mt-1">Gestionamos tu negocio con esencia, estilo y excelencia.</p>
            </header>

            <!-- Error Banner -->
            <div id="login-error" class="hidden text-error text-xs font-bold text-center bg-error-container text-on-error-container p-3 rounded-xl border border-error mb-4"></div>

            <!-- Login Form -->
            <form id="login-form" class="flex flex-col gap-4">
                <!-- Correo Electrónico -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-bold text-[#1A1A1A] flex items-center gap-1.5 ml-1" for="email">
                        <span aria-hidden="true" class="material-symbols-outlined text-[16px] text-[#745475]" style="font-variation-settings: 'FILL' 1;">mail</span>
                        Correo electrónico
                    </label>
                    <div class="relative flex items-center">
                        <input aria-required="true" class="input-premium h-[48px] w-full px-4 pr-10 rounded-xl bg-white text-sm text-[#1A1A1A] placeholder-[#C2B7C0] focus:border-primary focus:ring-0 transition-all outline-none border-2" id="email" name="email" placeholder="ejemplo@correo.com" required="" type="email"/>
                        <span class="material-symbols-outlined absolute right-3 text-lg text-[#C2B7C0]">person</span>
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-bold text-[#1A1A1A] flex items-center gap-1.5 ml-1" for="password">
                        <span aria-hidden="true" class="material-symbols-outlined text-[16px] text-[#745475]" style="font-variation-settings: 'FILL' 1;">lock</span>
                        Contraseña
                    </label>
                    <div class="relative flex items-center">
                        <input aria-required="true" class="input-premium h-[48px] w-full px-4 pr-12 rounded-xl bg-white text-sm text-[#1A1A1A] placeholder-[#C2B7C0] focus:border-primary focus:ring-0 transition-all outline-none border-2" id="password" name="password" placeholder="Ingrese su contraseña" required="" type="password"/>
                        <span role="button" id="toggle-password" class="material-symbols-outlined absolute right-3 text-xl text-[#C2B7C0] hover:text-[#745475] transition-colors focus:outline-none select-none cursor-pointer z-10 flex items-center justify-center" style="background: none !important; border: none !important; box-shadow: none !important; padding: 0 !important; width: auto !important; height: auto !important;">visibility</span>
                    </div>
                </div>

                <!-- Forgot Password -->
                <div class="flex justify-end -mt-1.5">
                    <a class="text-xs text-[#745475] font-bold hover:text-[#C59B27] transition-colors focus:outline-none" href="#" onclick="alert('Por favor solicite el restablecimiento de su contraseña al Administrador del sistema.'); return false;">
                        ¿Olvidó su contraseña?
                    </a>
                </div>

                <!-- Action Button -->
                <button class="btn-premium h-[50px] w-full text-white font-bold text-sm rounded-xl transition-all duration-200 focus:outline-none flex items-center justify-center gap-2 mt-2" type="submit">
                    <span aria-hidden="true" class="material-symbols-outlined text-[18px]">lock_open</span>
                    Iniciar Sesión
                    <span aria-hidden="true" class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </form>

            <!-- Bottom Request Note -->
            <div class="border-t border-[#F8C8D4]/40 mt-5 pt-4 text-center">
                <div class="bg-[#FFF0F3] p-3 rounded-2xl border border-[#F8C8D4]/50 flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-[#745475] text-[18px]">group</span>
                    <p class="text-[11px] text-on-surface-variant font-bold leading-tight text-left">
                        ¿No tienes cuenta? <br>
                        <span class="text-[#745475]">Solicita tus accesos al Administrador.</span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="auth.js"></script>
<script>
    // Toggle visibilidad contraseña
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePasswordBtn.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
    }
</script>
</body>
</html>
