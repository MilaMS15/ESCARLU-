<script>
    const user = getCurrentUser();
    const STORE_INV_KEY = "escarlu_tienda_stock"; // {storeId: {modelId: {size: qty}}}

    const MODELOS_DEFAULT = [
        { id_modelo: "MOD-001", tipo: "Polo",   nombre: "Camisero MC" },
        { id_modelo: "MOD-002", tipo: "Polo",   nombre: "Camisero ML" },
        { id_modelo: "MOD-003", tipo: "Polo",   nombre: "Girasol MC" },
        { id_modelo: "MOD-004", tipo: "Polo",   nombre: "Girasol ML" },
        { id_modelo: "MOD-005", tipo: "Polo",   nombre: "Redondo MC" },
        { id_modelo: "MOD-006", tipo: "Polo",   nombre: "Redondo ML" },
        { id_modelo: "MOD-007", tipo: "Polo",   nombre: "Cuadrado MC" },
        { id_modelo: "MOD-008", tipo: "Polo",   nombre: "Cuadrado ML" },
        { id_modelo: "MOD-009", tipo: "Polo",   nombre: "Tania MC" },
        { id_modelo: "MOD-010", tipo: "Polo",   nombre: "Tania ML" },
        { id_modelo: "MOD-011", tipo: "Polo",   nombre: "Noemi MC" },
        { id_modelo: "MOD-012", tipo: "Polo",   nombre: "Noemi ML" },
        { id_modelo: "MOD-013", tipo: "Polo",   nombre: "Boton MC" },
        { id_modelo: "MOD-014", tipo: "Polo",   nombre: "Boton ML" },
        { id_modelo: "MOD-015", tipo: "Short",  nombre: "Short Pinza" },
        { id_modelo: "MOD-016", tipo: "Short",  nombre: "Short Boton" },
        { id_modelo: "MOD-017", tipo: "Chompa", nombre: "Chompa Redondo" },
        { id_modelo: "MOD-018", tipo: "Chompa", nombre: "Chompa V" },
        { id_modelo: "MOD-019", tipo: "Buzo",   nombre: "Buzo Normal" },
        { id_modelo: "MOD-020", tipo: "Polo",   nombre: "Corazon MC" },
        { id_modelo: "MOD-021", tipo: "Polo",   nombre: "Corazon ML" }
    ];

    function getModelos() {
        return JSON.parse(localStorage.getItem("escarlu_modelos")) || MODELOS_DEFAULT;
    }

    function getTiendaStock() {
        const raw = JSON.parse(localStorage.getItem(STORE_INV_KEY)) || {};
        return raw[user.storeId] || {};
    }

    function saveTiendaStock(storeData) {
        const raw = JSON.parse(localStorage.getItem(STORE_INV_KEY)) || {};
        raw[user.storeId] = storeData;
        localStorage.setItem(STORE_INV_KEY, JSON.stringify(raw));
    }

    function getAllowedSizes(modelId) {
        const modelos = getModelos();
        const m = modelos.find(x => x.id_modelo === modelId);
        if (!m) return ["St", "L"];
        if (m.tipo === "Short") return ["S", "M", "L", "XL"];
        return ["St", "L"]; // Polos, Chompas y Buzos manejan St y L
    }

    // ── PAGINACIÓN VARIABLES ─────────────────────────────────────
    let currentPage = 1;
    const rowsPerPage = 5;

    // ── INVENTORY TABLE ──────────────────────────────────────────
    function renderInventoryTable() {
        const tbody   = document.getElementById("inventory-table-body");
        const theadTr = document.getElementById("table-head-tr");
        if (!tbody || !theadTr) return;

        const query         = (document.getElementById("inventory-search-filter")?.value || "").toLowerCase();
        const selectedTipo  = document.getElementById("select-filter-tipo")?.value  || "all";
        const selectedModel = document.getElementById("select-filter-modelo")?.value || "all";

        const stock   = getTiendaStock();
        const modelos = getModelos();
        tbody.innerHTML = "";
        
        // Determinar qué tallas mostrar en las columnas
        let activeSizes = ["St", "S", "M", "L", "XL"];
        let sizeColWidth = "7%"; // 5 tallas * 7% = 35%
        if (selectedTipo.toLowerCase() === "polo" || selectedTipo.toLowerCase() === "chompa" || selectedTipo.toLowerCase() === "buzo") {
            activeSizes = ["St", "L"];
            sizeColWidth = "15%"; // 2 tallas * 15% = 30%
        } else if (selectedTipo.toLowerCase() === "short") {
            activeSizes = ["S", "M", "L", "XL"];
            sizeColWidth = "10%"; // 4 tallas * 10% = 40%
        }

        // Renderizar cabecera dinámica con anchos fijos optimizados
        let headHtml = `<th class="px-5 py-3.5 border-b border-outline-variant" style="width: 30%;">Producto / Modelo</th>`;
        activeSizes.forEach(sz => {
            headHtml += `<th class="px-3 py-3.5 border-b border-outline-variant text-center" style="width: ${sizeColWidth};">${sz}</th>`;
        });
        headHtml += `
            <th class="px-3 py-3.5 border-b border-outline-variant text-center" style="width: 25%;">Estado</th>
            <th class="px-3 py-3.5 border-b border-outline-variant text-center" style="width: 10%;">Total</th>
        `;
        theadTr.innerHTML = headHtml;

        // 1. Filtrar primero los modelos según los inputs activos
        const modelosFiltrados = modelos.filter(m => {
            if (selectedTipo  !== "all" && m.tipo.toLowerCase() !== selectedTipo.toLowerCase()) return false;
            if (selectedModel !== "all" && m.id_modelo !== selectedModel) return false;
            if (query && !m.nombre.toLowerCase().includes(query) && !m.id_modelo.toLowerCase().includes(query)) return false;
            return true;
        });

        // 2. Mapear calculando el stock total de los modelos que pasaron el filtro
        const modelosConStock = modelosFiltrados.map(m => {
            const sizes = stock[m.id_modelo] || {};
            const allowedSizes = getAllowedSizes(m.id_modelo);
            let totalModel = 0;
            allowedSizes.forEach(sz => { totalModel += (sizes[sz] || 0); });
            return { model: m, totalModel, sizes, allowedSizes };
        });

        // 3. Ordenar estrictamente de mayor a menor stock total
        modelosConStock.sort((a, b) => {
            if (b.totalModel !== a.totalModel) {
                return b.totalModel - a.totalModel;
            }
            return a.model.nombre.localeCompare(b.model.nombre);
        });

        // 4. Lógica de Paginación
        const totalItems = modelosConStock.length;
        const totalPages = Math.ceil(totalItems / rowsPerPage) || 1;
        
        // Mantener currentPage dentro de los límites válidos
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIdx = (currentPage - 1) * rowsPerPage;
        const endIdx   = Math.min(startIdx + rowsPerPage, totalItems);
        const pagedData = modelosConStock.slice(startIdx, endIdx);

        // Actualizar textos e información del paginador
        document.getElementById("pagination-current").textContent = `Página ${currentPage} de ${totalPages}`;
        document.getElementById("pagination-info").textContent = totalItems > 0 
            ? `Mostrando ${startIdx + 1}-${endIdx} de ${totalItems} prendas`
            : "Mostrando 0-0 de 0 prendas";

        // Habilitar/deshabilitar botones
        document.getElementById("btn-prev-page").disabled = currentPage === 1;
        document.getElementById("btn-next-page").disabled = currentPage === totalPages;

        let rowCount = 0;

        for (const item of pagedData) {
            const m = item.model;
            const sizes        = item.sizes;
            const allowedSizes = item.allowedSizes;
            const totalModel   = item.totalModel;

            // Generar celdas dinámicas de talla sólo para las columnas activas
            let sizeCellsHtml = "";
            activeSizes.forEach(sz => {
                if (!allowedSizes.includes(sz)) {
                    sizeCellsHtml += `<td class="size-empty"></td>`;
                } else {
                    const val = sizes[sz] || 0;
                    sizeCellsHtml += `<td class="size-cell ${val === 0 ? 'text-on-surface/30' : 'text-on-surface'}">${val}</td>`;
                }
            });

            let statusBadge = "";
            if (totalModel > 15) {
                statusBadge = `<div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-green-500"></div><span class="text-sm font-semibold text-green-700">Óptimo</span></div>`;
            } else if (totalModel >= 5) {
                statusBadge = `<div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-yellow-500"></div><span class="text-sm font-semibold text-yellow-700">Moderado</span></div>`;
            } else if (totalModel > 0) {
                statusBadge = `<div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-error animate-pulse"></div><span class="text-sm font-bold text-error">Crítico</span></div>`;
            } else {
                statusBadge = `<div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-outline-variant"></div><span class="text-sm font-medium text-on-surface-variant">Sin Stock</span></div>`;
            }

            const tr = document.createElement("tr");
            tr.className = "transition-colors cursor-default";
            tr.innerHTML = `
                <td class="px-5 py-2.5">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-primary-container/40 rounded-xl flex items-center justify-center shrink-0">
                            <span class="material-symbols-outlined text-primary">apparel</span>
                        </div>
                        <div>
                            <p class="font-bold text-sm text-on-surface">${m.nombre}</p>
                            <p class="text-xs text-on-surface-variant mt-0.5">${m.tipo}</p>
                        </div>
                    </div>
                </td>
                ${sizeCellsHtml}
                <td class="px-3 py-2.5 text-center">
                    <div class="inline-flex justify-center">${statusBadge}</div>
                </td>
                <td class="px-3 py-2.5 text-center font-black text-base text-primary">${totalModel}</td>
            `;
            tbody.appendChild(tr);
            rowCount++;
        }

        if (rowCount === 0) {
            const totalColSpan = activeSizes.length + 3;
            tbody.innerHTML = `<tr><td colspan="${totalColSpan}" class="py-10 text-center text-xs text-on-surface-variant font-medium">No se encontraron resultados.</td></tr>`;
        }
    }

    // ── FILTER MODEL DROPDOWN ────────────────────────────────────
    function updateFilterModels() {
        const tipo    = document.getElementById("select-filter-tipo")?.value || "all";
        const select  = document.getElementById("select-filter-modelo");
        if (!select) return;
        const modelos = getModelos();
        const filtered = tipo === "all" ? modelos : modelos.filter(m => m.tipo.toLowerCase() === tipo.toLowerCase());
        select.innerHTML = '<option value="all">Todos los modelos</option>';
        filtered.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m.id_modelo;
            opt.textContent = m.nombre;
            select.appendChild(opt);
        });
        renderInventoryTable();
    }

    // ── INGRESO MODAL ────────────────────────────────────────────
    function openModal() {
        document.getElementById("ingreso-modal").classList.add("open");
        updateIngresoModelos();
        updatePreview();
    }
    function closeModal() {
        document.getElementById("ingreso-modal").classList.remove("open");
        document.getElementById("ingreso-form").reset();
        document.getElementById("ingreso-preview").classList.add("hidden");
        document.getElementById("ingreso-cantidad").value = 1;
        updateIngresoModelos();
    }

    function updateIngresoModelos() {
        const tipo    = document.getElementById("ingreso-tipo").value;
        const select  = document.getElementById("ingreso-modelo");
        const modelos = getModelos();
        const filtered = modelos.filter(m => m.tipo.toLowerCase() === tipo.toLowerCase());
        select.innerHTML = "";
        filtered.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m.id_modelo;
            opt.textContent = m.nombre;
            select.appendChild(opt);
        });
        updateIngresoTallas();
        updatePreview();
    }

    function updateIngresoTallas() {
        const modelId  = document.getElementById("ingreso-modelo").value;
        const select   = document.getElementById("ingreso-talla");
        const allowed  = getAllowedSizes(modelId);
        select.innerHTML = "";
        allowed.forEach(sz => {
            const opt = document.createElement("option");
            opt.value = sz;
            opt.textContent = sz === "St" ? "St (Standard)" : sz;
            select.appendChild(opt);
        });
        updatePreview();
    }

    function updatePreview() {
        const modelo  = document.getElementById("ingreso-modelo");
        const talla   = document.getElementById("ingreso-talla").value;
        const cant    = parseInt(document.getElementById("ingreso-cantidad").value) || 0;
        const preview = document.getElementById("ingreso-preview");
        const text    = document.getElementById("ingreso-preview-text");
        if (modelo.value && talla && cant > 0) {
            const nombre = modelo.options[modelo.selectedIndex]?.text || modelo.value;
            text.textContent = `Se agregarán ${cant} unidad(es) de "${nombre}" — Talla ${talla} al inventario de la tienda.`;
            preview.classList.remove("hidden");
        } else {
            preview.classList.add("hidden");
        }
    }

    function handleIngresoSubmit(e) {
        e.preventDefault();
        const modelId = document.getElementById("ingreso-modelo").value;
        const talla   = document.getElementById("ingreso-talla").value;
        const cant    = parseInt(document.getElementById("ingreso-cantidad").value);

        if (!modelId || !talla || isNaN(cant) || cant <= 0) {
            alert("Por favor completa todos los campos correctamente.");
            return;
        }

        const stock = getTiendaStock();
        if (!stock[modelId]) stock[modelId] = {};
        stock[modelId][talla] = (stock[modelId][talla] || 0) + cant;
        saveTiendaStock(stock);

        const modelos = getModelos();
        const modelName = modelos.find(m => m.id_modelo === modelId)?.nombre || "Prenda";

        closeModal();
        renderInventoryTable();
        showSuccessModal(cant, modelName, talla);
    }

    // ── SUCCESS MODAL ────────────────────────────────────────────
    function showSuccessModal(cant, modelName, talla) {
        const modal = document.getElementById("success-modal");
        const card  = document.getElementById("success-card");
        const text  = document.getElementById("success-modal-text");
        
        const tallaStr = talla === "St" ? "Talla St (Standard)" : `Talla ${talla}`;
        text.innerHTML = `Se agregaron <strong>${cant} unidades</strong> de <strong>"${modelName}"</strong> (${tallaStr}) correctamente al inventario de la tienda.`;
        
        modal.classList.remove("pointer-events-none");
        modal.classList.add("opacity-100");
        card.classList.remove("scale-90");
        card.classList.add("scale-100");

        // Evento de cierre
        const closeBtn = document.getElementById("btn-success-close");
        closeBtn.onclick = () => {
            modal.classList.remove("opacity-100");
            modal.classList.add("opacity-0");
            card.classList.remove("scale-100");
            card.classList.add("scale-90");
            setTimeout(() => {
                modal.classList.add("pointer-events-none");
            }, 300);
        };
    }

    // ── INIT ─────────────────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", () => {
        checkAuth();
        renderSideNav("stocktienda");

        const storeName = STORE_NAMES?.[user.storeId] || "Tienda";
        document.getElementById("page-title").textContent    = `Stock Tienda — ${storeName}`;

        // Date
        const now = new Date();
        document.getElementById("current-date-label").textContent =
            now.toLocaleDateString("es-PE", { day: "numeric", month: "long", year: "numeric" });

        renderInventoryTable();
        updateFilterModels();

        // Filter events
        document.getElementById("select-filter-tipo").addEventListener("change", () => { currentPage = 1; updateFilterModels(); });
        document.getElementById("select-filter-modelo").addEventListener("change", () => { currentPage = 1; renderInventoryTable(); });
        document.getElementById("inventory-search-filter").addEventListener("input", () => { currentPage = 1; renderInventoryTable(); });
        document.getElementById("inventory-search-table").addEventListener("input", (e) => {
            document.getElementById("inventory-search-filter").value = e.target.value;
            currentPage = 1;
            renderInventoryTable();
        });

        // Pagination events
        document.getElementById("btn-prev-page").addEventListener("click", () => {
            if (currentPage > 1) {
                currentPage--;
                renderInventoryTable();
            }
        });
        document.getElementById("btn-next-page").addEventListener("click", () => {
            currentPage++;
            renderInventoryTable();
        });

        // Modal open/close
        document.getElementById("btn-open-ingreso").addEventListener("click", openModal);
        document.getElementById("btn-close-modal").addEventListener("click", closeModal);
        document.getElementById("btn-cancel-ingreso").addEventListener("click", closeModal);
        document.getElementById("ingreso-modal").addEventListener("click", (e) => {
            if (e.target === document.getElementById("ingreso-modal")) closeModal();
        });

        // Modal form events
        document.getElementById("ingreso-tipo").addEventListener("change", updateIngresoModelos);
        document.getElementById("ingreso-modelo").addEventListener("change", () => { updateIngresoTallas(); updatePreview(); });
        document.getElementById("ingreso-talla").addEventListener("change", updatePreview);
        document.getElementById("ingreso-cantidad").addEventListener("input", updatePreview);
        document.getElementById("ingreso-minus").addEventListener("click", () => {
            const inp = document.getElementById("ingreso-cantidad");
            inp.value = Math.max(1, (parseInt(inp.value) || 1) - 1);
            updatePreview();
        });
        document.getElementById("ingreso-plus").addEventListener("click", () => {
            const inp = document.getElementById("ingreso-cantidad");
            inp.value = (parseInt(inp.value) || 0) + 1;
            updatePreview();
        });

        // Form submit
        document.getElementById("ingreso-form").addEventListener("submit", handleIngresoSubmit);
    });
</script>
</body></html>
